name: Continuous Integration & Deployment - Backend

on:
  push:
    branches: [ main ]
    paths: ['backend/**']
  pull_request:
    branches: [ main ]
    paths: ['backend/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run import tests
      run: cd backend && python test_imports.py

  deploy-to-production:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - uses: actions/checkout@v3

    - name: Trigger Render Webhook Deploy
      shell: bash
      run: |
        render_hook_url="$(printf '%s' '${{ secrets.RENDER_DEPLOY_HOOK_URL }}' | tr -d '\r\n')"

        if [ -z "$render_hook_url" ]; then
          echo "RENDER_DEPLOY_HOOK_URL secret is empty or invalid."
          exit 1
        fi

        if [[ ! "$render_hook_url" =~ ^https:// ]]; then
          echo "RENDER_DEPLOY_HOOK_URL must start with https://."
          exit 1
        fi

        curl --fail --silent --show-error -X POST "$render_hook_url"
